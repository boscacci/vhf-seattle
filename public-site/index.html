<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elliott Bay VHF</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">Elliott Bay VHF</p>
          <h1 id="site-title">Elliott Bay VHF</h1>
          <p id="site-subtitle">Live Elliott Bay marine VHF audio and recent receiver clips.</p>
        </div>
        <dl class="stats" id="stats"></dl>
      </header>

      <nav class="tabs" aria-label="Radio views">
        <button class="tab is-active" id="tab-clips" type="button" data-tab="clips">
          Clip Review
        </button>
        <button class="tab" id="tab-live" type="button" data-tab="live">
          Live Monitor
        </button>
        <button id="refresh-clips" class="refresh" type="button">Refresh</button>
      </nav>

      <section
        class="tab-panel is-active"
        id="panel-clips"
        aria-labelledby="tab-clips"
      >
        <div class="section-heading">
          <div>
            <p class="eyebrow">Transcripts</p>
            <h2 id="clips-title">Recent Clips</h2>
          </div>
          <p id="clip-status" class="status-text" aria-live="polite">Loading clips...</p>
        </div>
        <div class="clip-controls" aria-label="Clip filters">
          <label class="channel-filter-label" for="channel-filter">Channel</label>
          <select id="channel-filter" class="channel-filter">
            <option value="all">All channels</option>
          </select>
        </div>
        <div id="clips" class="clip-list"></div>
        <nav id="clip-pagination" class="clip-pagination" aria-label="Clip pages"></nav>
      </section>

      <section class="tab-panel" id="panel-live" aria-labelledby="tab-live" hidden>
        <div class="live-grid">
          <article class="live-card">
            <div class="section-heading live-heading">
              <div>
                <p class="eyebrow">Receiver</p>
                <h2>Live Audio</h2>
              </div>
              <p id="live-status" class="status-text" aria-live="polite">Ready</p>
            </div>
            <div class="tuner-display">
              <span id="live-signal-dot" class="signal-dot" aria-hidden="true"></span>
              <span class="tuner-copy">
                <span id="live-channel">Current SDR feed</span>
                <span id="live-frequency">Checking receiver status</span>
              </span>
            </div>
            <div id="live-channel-picker" class="live-channel-picker" role="group" aria-label="Live channel"></div>
            <div id="waveform-panel" class="waveform-panel">
              <canvas
                id="waveform-canvas"
                width="960"
                height="240"
                aria-label="Live audio waveform"
              ></canvas>
              <div id="waiting-indicator" class="waiting-indicator" aria-hidden="true">
                <span></span>
                <p>Waiting for transmission</p>
              </div>
            </div>
            <audio id="live-audio" preload="none"></audio>
            <div class="live-actions">
              <button id="play-live" class="primary" type="button">Play</button>
            </div>
          </article>
        </div>
      </section>
    </main>

    <script src="/assets/app.js" type="module"></script>
  </body>
</html>

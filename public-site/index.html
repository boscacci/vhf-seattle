<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Talking Boats</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Elliott Bay VHF</p>
          <h1 id="site-title">Talking Boats</h1>
        </div>
        <button id="refresh-clips" class="secondary" type="button">Refresh</button>
      </header>

      <section class="summary" aria-labelledby="summary-title">
        <div>
          <h2 id="summary-title">Recent Real Clips</h2>
          <p id="site-subtitle">Fresh transcribed marine-radio audio from the receiver.</p>
        </div>
        <dl class="stats" id="stats"></dl>
      </section>

      <section class="clips-panel" aria-labelledby="clips-title">
        <div class="section-heading">
          <p class="eyebrow">Audio</p>
          <h2 id="clips-title">Latest Transcripts</h2>
          <p id="clip-status" class="status-text" aria-live="polite">Loading clips...</p>
        </div>
        <div id="clips" class="clip-list"></div>
      </section>
    </main>

    <script src="/assets/app.js" type="module"></script>
  </body>
</html>

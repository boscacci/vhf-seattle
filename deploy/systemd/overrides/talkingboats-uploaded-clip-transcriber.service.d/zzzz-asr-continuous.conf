# One shared, resident CPU worker. Explicit settings override legacy hourly/CPU drop-ins.
[Service]
Type=simple
ExecStart=
ExecStart=%h/miniforge3/condabin/conda run --no-capture-output -n dell talkingboats-transcribe-uploaded-clips --poll-seconds 5 --limit 5 --cpu-threads 6 --workers 1
Restart=on-failure
RestartSec=5
TimeoutStartSec=90
TimeoutStopSec=90
Environment=TALKINGBOATS_TRANSCRIBE_CPU_THREADS=6
Environment=TALKINGBOATS_TRANSCRIBE_WORKERS=1
CPUQuota=300%
CPUWeight=10
Nice=10

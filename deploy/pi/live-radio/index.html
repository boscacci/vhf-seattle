<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Talking Boats Live</title>
    <link rel="stylesheet" href="/styles.css?asset-version=20260524-channel-ui">
    <script src="/config.js?asset-version=20260524-channel-ui" defer></script>
    <script src="/app.js?asset-version=20260524-channel-ui" defer></script>
  </head>
  <body>
    <main class="radio-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">LAN radio</p>
          <h1>Talking Boats</h1>
        </div>
        <div id="stream-state" class="state" data-state="idle">Idle</div>
      </header>

      <section class="tuner" aria-label="Live radio tuner">
        <div class="dial">
          <span id="frequency">156.425</span>
          <span class="unit">MHz</span>
        </div>
        <div class="channel-row">
          <span id="channel-label">VHF 68</span>
          <span>MP3 stream</span>
        </div>
        <div id="channel-menu" class="channel-menu" hidden>
          <label for="channel-select">Channel</label>
          <select id="channel-select" autocomplete="off"></select>
          <span id="channel-status" class="channel-status" aria-live="polite"></span>
        </div>
        <audio id="live-player" controls preload="none"></audio>
      </section>

      <section id="caption-panel" class="caption-panel" aria-label="Live captions" hidden>
        <div class="caption-header">
          <h2>Live Captions</h2>
          <span id="caption-state" class="caption-state" data-state="idle">Listening</span>
        </div>
        <ol id="caption-list" class="caption-list"></ol>
      </section>

    </main>
  </body>
</html>

events {}

stream {
  map $ssl_preread_server_name $tls_upstream {
    pi.hole 127.0.0.1:9444;
    vhf-dev.robertboscacci.com 127.0.0.1:9443;
    dev.seattleboatradio.com 127.0.0.1:9443;
    gotify.robertboscacci.com 127.0.0.1:8444;
    laundry.robertboscacci.com 127.0.0.1:8444;
    # Pi-hole's special hostname resolves to this tailnet address. Keep the
    # unmatched SNI fallback here too so an app cannot accidentally take it over.
    default 127.0.0.1:9444;
  }

  server {
    listen 100.124.5.39:443;
    listen [fd7a:115c:a1e0::2601:597]:443;
    proxy_pass $tls_upstream;
    ssl_preread on;
  }
}

http {
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  server {
    listen 100.124.5.39:80;
    listen [fd7a:115c:a1e0::2601:597]:80;
    server_name vhf-dev.robertboscacci.com dev.seattleboatradio.com gotify.robertboscacci.com laundry.robertboscacci.com;

    return 308 https://$host$request_uri;
  }

  server {
    listen 100.124.5.39:80 default_server;
    listen [fd7a:115c:a1e0::2601:597]:80 default_server;
    server_name _;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto http;
      proxy_pass http://127.0.0.1:8082;
    }
  }

  server {
    listen 127.0.0.1:9443 ssl;
    http2 on;
    server_name dev.seattleboatradio.com;

    ssl_certificate /etc/letsencrypt/live/dev.seattleboatradio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.seattleboatradio.com/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-TalkingBoats-Tailnet-Dev 1;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_pass http://172.20.0.1:8095;
    }
  }

  server {
    listen 127.0.0.1:9444 ssl default_server;
    http2 on;
    server_name pi.hole;

    ssl_certificate /etc/nginx/pihole/tls.pem;
    ssl_certificate_key /etc/nginx/pihole/tls.pem;
    ssl_session_cache shared:PIHOLE_SSL:1m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://127.0.0.1:8082;
    }
  }
}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Talking Boats Operator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <div class="heading">
          <p>Private Clip Console</p>
          <h1>Talking Boats</h1>
        </div>

        <div class="clip-toolbar">
          <div>
            <p class="label">Recent transcribed clips</p>
            <p id="clip-status" class="status-text">Loading clips...</p>
          </div>
          <button id="refresh-clips" class="secondary" type="button">Refresh</button>
        </div>

        <section id="clip-list" class="clip-list" aria-live="polite"></section>
      </section>
    </main>

    <script src="main.js" type="module"></script>
  </body>
</html>

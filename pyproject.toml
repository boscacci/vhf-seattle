[project]
name = "elliott-bay-vhf"
version = "0.1.0"
description = "Private VHF capture and public recent-clip showcase for Elliott Bay radio monitoring."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "numpy>=1.26,<3",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]
analysis = [
    "numpy>=1.26,<3",
    "bertopic>=0.16,<1",
    "pandas>=2.2,<3",
    "plotly>=5.22,<7",
    "scikit-learn>=1.4,<2",
    "sentence-transformers>=3,<6",
    "tqdm>=4.66,<5",
]
transcribe = [
    "faster-whisper>=1.1,<2",
]
asr-train = [
    "accelerate>=0.33,<2",
    "datasets>=2.19,<4",
    "torch>=2.2,<3",
    "transformers>=4.45,<5",
]

[project.scripts]
talkingboats-api = "talkingboats.api:main"
talkingboats-fetch-ais-history = "talkingboats.ais_history:main"
talkingboats-simulate-radio = "talkingboats.simulator:main"
talkingboats-upload-clip = "talkingboats.capture_uploader:main"
talkingboats-edge-capture = "talkingboats.edge_capture:main"
talkingboats-icecast-source = "talkingboats.icecast_source:main"
talkingboats-live-transcriber = "talkingboats.live_transcriber:main"
talkingboats-live-radio-proxy = "talkingboats.live_radio_proxy:main"
talkingboats-transcribe-uploaded-clips = "talkingboats.clip_transcriber:main"
talkingboats-capture-profiles = "talkingboats.capture_profiles:main"
talkingboats-upload-spooled-clips = "talkingboats.spool_uploader:main"
talkingboats-export-public = "talkingboats.publish:main"
talkingboats-analyze-audio = "talkingboats.audio_analysis:main"
talkingboats-analyze-transcripts = "talkingboats.lexical_analysis:main"
talkingboats-train-asr-feedback = "talkingboats.asr_feedback:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

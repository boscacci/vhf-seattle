[project]
name = "talkingboats"
version = "0.1.0"
description = "Private VHF/AIS capture and public static showcase for Elliott Bay radio monitoring."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[project.scripts]
talkingboats-api = "talkingboats.api:main"
talkingboats-simulate-radio = "talkingboats.simulator:main"
talkingboats-upload-clip = "talkingboats.capture_uploader:main"
talkingboats-export-public = "talkingboats.publish:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

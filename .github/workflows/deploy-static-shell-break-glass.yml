name: Deploy production static shell (break glass)

on:
  workflow_dispatch:
    inputs:
      confirm_break_glass:
        description: Confirm the explicitly authorized production bypass
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-static-shell
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm_break_glass == true
    environment: production-break-glass
    runs-on: [self-hosted, Linux, X64, optiplex, vhf-seattle]
    timeout-minutes: 5
    steps:
      - name: Check out the exact approved revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the revision is protected main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          git switch -C main "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Provision runner deployment tools
        run: |
          test -x /home/rob/.local/bin/tofu
          test -x /snap/aws-cli/current/bin/aws
          /home/rob/.local/bin/tofu version
          /snap/aws-cli/current/bin/aws --version
          echo "/home/rob/.local/bin" >> "${GITHUB_PATH}"
          echo "/snap/aws-cli/current/bin" >> "${GITHUB_PATH}"
      - name: Install browser smoke dependencies
        run: npm ci --ignore-scripts
      - name: Revalidate the release candidate
        run: |
          /home/rob/miniforge3/condabin/conda run --no-capture-output -n dell pytest -q
          /home/rob/miniforge3/condabin/conda run --no-capture-output -n dell ruff check .
          node --check scripts/ais_browser_smoke.mjs
          bash -n scripts/deploy_static_shell.sh
      - name: Deploy the checked-in production shell
        run: scripts/deploy_static_shell.sh prod public-site
      - name: Prove real production AIS vessels render
        env:
          TALKINGBOATS_AIS_SMOKE_BASE_URL: https://seattleboatradio.com
        run: npm run smoke:ais

name: Deploy transcriber CPU policy

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated release tag selecting the dev-tested main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-transcriber-cpu
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: [self-hosted, Linux, X64, optiplex, vhf-seattle]
    timeout-minutes: 5
    outputs:
      artifact_path: ${{ steps.artifact.outputs.artifact_path }}
      artifact_sha256: ${{ steps.artifact.outputs.artifact_sha256 }}
    steps:
      - name: Check out the protected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify the immutable tag and protected revision
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          git fetch --tags origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          [[ "${RELEASE_TAG}" =~ ^transcriber/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "${RELEASE_TAG}")" = "tag"
          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${GITHUB_SHA}"
          git switch -C main "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Resolve the dev-tested artifact
        id: artifact
        run: |
          candidate_dir="${HOME}/.local/share/talkingboats/release-candidates/performance/${GITHUB_SHA}"
          artifact_path="${candidate_dir}/performance-release.tar.gz"
          test -f "${artifact_path}"
          test "$(tr -d '\n' < "${candidate_dir}/release-commit")" = "${GITHUB_SHA}"
          artifact_sha256="$(tr -d '\n' < "${candidate_dir}/performance-release.sha256")"
          test "$(sha256sum "${artifact_path}" | awk '{print $1}')" = "${artifact_sha256}"
          test "$(cat "${candidate_dir}/dev-smoke-passed")" = "${artifact_sha256}"
          echo "artifact_path=${artifact_path}" >> "${GITHUB_OUTPUT}"
          echo "artifact_sha256=${artifact_sha256}" >> "${GITHUB_OUTPUT}"

  deploy-production:
    needs: validate-release
    environment: production
    runs-on: [self-hosted, Linux, X64, optiplex, vhf-seattle]
    timeout-minutes: 5
    steps:
      - name: Check out the exact approved revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify approved revision identity
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          git switch -C main "${GITHUB_SHA}"
      - name: Install the exact dev-tested CPU policy
        env:
          TALKINGBOATS_RELEASE_COMMIT: ${{ github.sha }}
          TALKINGBOATS_RELEASE_SHA256: ${{ needs.validate-release.outputs.artifact_sha256 }}
        run: |
          artifact="${{ needs.validate-release.outputs.artifact_path }}"
          test "$(sha256sum "$artifact" | awk '{print $1}')" = "${TALKINGBOATS_RELEASE_SHA256}"
          release_root="$(mktemp -d)"
          trap 'rm -rf "$release_root"' EXIT
          tar -xzf "$artifact" -C "$release_root"
          bash "$release_root/scripts/apply_transcriber_cpu_release.sh" "$release_root"
          test "$(systemctl --user show talkingboats-uploaded-clip-transcriber.service -p CPUQuotaPerSecUSec --value)" = 6s
          systemctl --user show talkingboats-uploaded-clip-transcriber.service -p ExecStart --value | grep -q -- '--cpu-threads 6'

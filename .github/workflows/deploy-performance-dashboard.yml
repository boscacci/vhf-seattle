name: Deploy performance dashboard release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated release tag selecting the dev-tested main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-performance-dashboard
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: [self-hosted, Linux, X64, optiplex, vhf-seattle]
    timeout-minutes: 5
    outputs:
      artifact_path: ${{ steps.artifact.outputs.artifact_path }}
      artifact_sha256: ${{ steps.artifact.outputs.artifact_sha256 }}
    steps:
      - name: Check out the protected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify the immutable tag and protected revision
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          git fetch --tags origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "${RELEASE_TAG}")" = "tag"
          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${GITHUB_SHA}"
          git switch -C main "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Resolve the dev-tested artifact
        id: artifact
        run: |
          candidate_dir="${HOME}/.local/share/talkingboats/release-candidates/performance/${GITHUB_SHA}"
          artifact_path="${candidate_dir}/performance-release.tar.gz"
          test -f "${artifact_path}"
          test "$(tr -d '\n' < "${candidate_dir}/release-commit")" = "${GITHUB_SHA}"
          artifact_sha256="$(tr -d '\n' < "${candidate_dir}/performance-release.sha256")"
          test "$(sha256sum "${artifact_path}" | awk '{print $1}')" = "${artifact_sha256}"
          echo "artifact_path=${artifact_path}" >> "${GITHUB_OUTPUT}"
          echo "artifact_sha256=${artifact_sha256}" >> "${GITHUB_OUTPUT}"

  deploy-production:
    needs: validate-release
    environment: production
    runs-on: [self-hosted, Linux, X64, optiplex, vhf-seattle]
    timeout-minutes: 5
    steps:
      - name: Check out the exact approved revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify approved revision identity
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          git switch -C main "${GITHUB_SHA}"
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Provision release tools
        run: |
          test -x /home/rob/.local/bin/tofu
          test -x /snap/aws-cli/current/bin/aws
          echo "/home/rob/.local/bin" >> "${GITHUB_PATH}"
          echo "/snap/aws-cli/current/bin" >> "${GITHUB_PATH}"
          npm ci --ignore-scripts
      - name: Promote the exact dev-tested backend
        env:
          TALKINGBOATS_RELEASE_COMMIT: ${{ github.sha }}
          TALKINGBOATS_RELEASE_SHA256: ${{ needs.validate-release.outputs.artifact_sha256 }}
        run: |
          release_root="$(mktemp -d)"
          trap 'rm -rf "${release_root}"' EXIT
          tar -xzf "${{ needs.validate-release.outputs.artifact_path }}" -C "${release_root}"
          "${release_root}/scripts/apply_optiplex_performance_release.sh" prod "${release_root}"
          scripts/deploy_static_shell.sh prod "${release_root}/public-site"
      - name: Smoke the real production performance view
        env:
          TALKINGBOATS_PERFORMANCE_SMOKE_BASE_URL: https://seattleboatradio.com
        run: npm run smoke:performance

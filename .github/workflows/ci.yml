name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, optiplex, vhf-seattle]
    timeout-minutes: 5
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify revision identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - name: Test
        run: /home/rob/miniforge3/condabin/conda run --no-capture-output -n dell pytest -q
      - name: Lint
        run: /home/rob/miniforge3/condabin/conda run --no-capture-output -n dell ruff check .
      - name: Validate deployment scripts
        run: bash -n deploy/pi/install_live_radio.sh deploy/pi/live-radio/talkingboats-pi-healthcheck scripts/deploy_pi_capture_health.sh scripts/apply_pi_capture_health_release.sh
